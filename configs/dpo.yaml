# chsm8: DPO on chsm8-sft with description pairs (see scripts/train/dpo.py). One GPU, 4,366 steps (20 minutes on
# a GH200). With more GPUs each step sees more games; keep max_steps or scale it down.
data: data/sides
init: LegumMagister/chsm8-sft:model.pt
out: runs/dpo
encoder: google/embeddinggemma-300m
beta: 0.5
nll_weight: 1.0
kl_weight: 1.0
lr: 2.0e-7
text_lr: 1.0e-4
weight_decay: 0.0
warmup: 0.05
min_lr_ratio: 0.0
grad_clip: 1.0
legal_penalty: 0.5
games: 128
token_budget: 98304
max_steps: 4366
load_in_ram: true
seed: 1
log_every: 25
eval_every: 1000
eval_games: 1000
