# chsm8-player-base: chsm8-pt continued on 26.0M unique post-training games (one pass, 1.95B positions), no text.
# The pretraining scaffold is folded into each layer's constant, which now trains with the rest.
data: data/games           # scripts/data/prepare_posttraining.py --games
out: runs/player_base
init: LegumMagister/chsm8-pt:chsm8_latest.pt
n_layers: 12
d_model: 960
n_heads: 15
d_ff: 3520
train_no_text: true
focal_only: false
batch_size: 32
max_positions: 1946812928
passes: 0
lr: 5.0e-5
warmup: 0.05
min_lr_ratio: 0.0
weight_decay: 0.1
grad_clip: 1.0
legal_penalty: 0.5
compile: false
seed: 42
log_every: 200
eval_every: 2000
eval_batches: 50
save_every: 2000
