# chsm8-sft: chsm8-pt conditioned on text. One pass over the 27.1M described training sides of chsm8-post-training,
# each with all five descriptions, plus three passes over the player games spread evenly over the run.
# Ran on 8 GH200 (2 nodes x 4) in about 3.1 hours: 28,239 steps.
data: data/sides                # scripts/data/prepare_posttraining.py --sides
player_data: data/player_sides  # scripts/data/prepare_players.py --sides; "" = no player games
player_passes: 3
init: LegumMagister/chsm8-pt:chsm8_latest.pt
out: runs/sft
text_layers: 6                  # cross-attention in the top 6 of 12 layers
encoder: google/embeddinggemma-300m
lr: 5.0e-7                      # decoder weights
text_lr: 8.0e-4                 # text projection, gates, cross-attention
weight_decay: 0.0
warmup: 0.05
min_lr_ratio: 0.0
grad_clip: 1.0
legal_penalty: 0.5
description_dropout: 0.1        # share of (game, description) rows trained without text
games: 128                      # per GPU and step, at most
token_budget: 98304             # games x longest game x descriptions per game, at most
max_games: 0                    # 0 = all training sides
load_in_ram: true               # ~10 GB of rows; random reads from a network filesystem are slow
seed: 1
log_every: 25
eval_every: 2000
eval_games: 2000
save_every: 500
