# Text conditioning for the nano model (configs/nano.yaml) on a small slice of chsm8-post-training.
# Same code as chsm8-sft; the text encoder (EmbeddingGemma-300m, needs a Hugging Face login) is the slow part on CPU.
data: data/nano_sides
player_data: ""
player_passes: 0
init: runs/nano/model.pt
out: runs/nano_sft
text_layers: 2
encoder: google/embeddinggemma-300m
lr: 1.0e-4
text_lr: 1.0e-3
weight_decay: 0.0
warmup: 0.05
min_lr_ratio: 0.0
grad_clip: 1.0
legal_penalty: 0.5
description_dropout: 0.1
games: 16
token_budget: 40960
max_games: 0
load_in_ram: true
seed: 1
log_every: 10
eval_every: 100000
eval_games: 64
save_every: 100000
